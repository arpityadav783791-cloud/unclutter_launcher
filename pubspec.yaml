name: minimal_launcher
description: A minimalist, distraction-free Android launcher.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
